include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

// Fallback offline para Android Studio si no existe node_modules
def capNode = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
if (!capNode.exists()) {
    project(':capacitor-android').projectDir = new File(settingsDir, 'capacitor-android')
}